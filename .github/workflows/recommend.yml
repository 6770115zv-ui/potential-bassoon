name: recommend
run-name: rec-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Unique request ID"
        required: true
        type: string
      query:
        description: "Strict topic search query"
        required: true
        type: string
      min_views:
        description: "Minimum view count filter"
        required: false
        default: "500000"
        type: string
      exclude_ids:
        description: "Comma-separated video IDs to exclude"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install yt-dlp
        run: |
          sudo curl -sSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          sudo /usr/local/bin/yt-dlp --update-to nightly || true

      - name: Fetch and Filter Strict Ultra-Popular Recommendations
        env:
          REQ_ID: ${{ inputs.request_id }}
          QUERY: ${{ inputs.query }}
          MIN_VIEWS: ${{ inputs.min_views }}
          EXCLUDE_IDS: ${{ inputs.exclude_ids }}
        run: |
          python3 - << 'PYEOF'
          import os, json, subprocess, urllib.request, base64, re

          query = os.environ.get("QUERY", "").strip()
          req_id = os.environ.get("REQ_ID", "0").strip()
          try:
              min_views = int(os.environ.get("MIN_VIEWS", "500000").strip() or "500000")
          except Exception:
              min_views = 500000
          exclude = set(x.strip() for x in os.environ.get("EXCLUDE_IDS", "").split(",") if x.strip())

          stopwords = {
              "the", "and", "for", "with", "from", "that", "this", "how", "what", "why", "who",
              "video", "official", "full", "new", "best", "top", "part", "episode",
              "איך", "של", "על", "עם", "או", "גם", "כל", "זה", "אל", "את", "לא", "כי", "אם", "סרטון", "מלא", "חדש"
          }
          raw_tokens = [
              t.lower()
              for t in re.split(r"[^\w\u0590-\u05ff]+", query)
              if len(t) >= 2 and t.lower() not in stopwords
          ]

          cmd = [
              "/usr/local/bin/yt-dlp",
              f"ytsearch80:{query}",
              "--dump-json",
              "--flat-playlist",
              "--skip-download",
              "--no-warnings",
              "--extractor-args", "youtube:player_client=android_vr,ios,mweb"
          ]
          proc = subprocess.run(cmd, capture_output=True, text=True)

          candidates = []
          seen = set(exclude)

          for line in proc.stdout.splitlines():
              line = line.strip()
              if not line:
                  continue
              try:
                  item = json.loads(line)
              except Exception:
                  continue

              vid = item.get("id")
              title = (item.get("title") or "").strip()
              if not vid or not title or vid in seen:
                  continue

              views = item.get("view_count") or 0
              duration = item.get("duration") or 0

              # Strict filter: skip Shorts (<120s) and skip low-view videos
              if duration and duration < 120:
                  continue
              if views < min_views:
                  continue

              title_lower = title.lower()
              if raw_tokens:
                  matched = sum(1 for tok in raw_tokens if tok in title_lower)
                  required = len(raw_tokens) if len(raw_tokens) <= 2 else max(2, int(len(raw_tokens) * 0.75))
                  if matched < required:
                      continue
                  exact_all = (matched == len(raw_tokens))
              else:
                  exact_all = True

              seen.add(vid)
              candidates.append({
                  "id": vid,
                  "title": title,
                  "url": f"https://www.youtube.com/watch?v={vid}",
                  "channel": item.get("channel") or item.get("uploader") or "YouTube",
                  "views": views,
                  "duration": duration,
                  "exact_all": exact_all
              })

          # Sort strictly by (exact_all match first, then highest view count)
          candidates.sort(key=lambda x: (1 if x["exact_all"] else 0, x["views"]), reverse=True)
          top_list = candidates[:12]

          # Embed base64 thumbnail so NetFree never blocks the preview image
          for c in top_list:
              vid = c["id"]
              thumb_b64 = ""
              for t_url in [f"https://i.ytimg.com/vi/{vid}/mqdefault.jpg", f"https://i.ytimg.com/vi/{vid}/hqdefault.jpg"]:
                  try:
                      req = urllib.request.Request(t_url, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=5) as resp:
                          raw_img = resp.read()
                          if len(raw_img) > 500:
                              thumb_b64 = "data:image/jpeg;base64," + base64.b64encode(raw_img).decode("ascii")
                              break
                  except Exception:
                      pass
              c["thumbnail"] = thumb_b64

          os.makedirs("/tmp/rec_out", exist_ok=True)
          out_data = {
              "ok": True,
              "query": query,
              "min_views": min_views,
              "count": len(top_list),
              "items": top_list
          }
          with open(f"/tmp/rec_out/recs-{req_id}.json", "w", encoding="utf-8") as f:
              json.dump(out_data, f, ensure_ascii=False, indent=2)
          PYEOF

      - name: Publish Recommendations Release Asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="rec-${{ inputs.request_id }}"
          gh release create "$TAG" /tmp/rec_out/*             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --title "$TAG"             --notes "Strict Topic Popular Recommendations"             --prerelease
